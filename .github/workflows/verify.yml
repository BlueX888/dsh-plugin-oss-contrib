name: Verify plugin
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Native core ref for integration tests (optional)
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: node --test tests/unit/*.test.js
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: '*.tgz'
  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.core_ref != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: BlueX888/PR
          ref: ${{ inputs.core_ref }}
          token: ${{ secrets.OSS_CORE_TOKEN || github.token }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
        working-directory: plugin
      - run: npm test
        working-directory: plugin
        env:
          OSS_TEST_ROOT: ${{ github.workspace }}/core
          OSS_BIN: ${{ github.workspace }}/core/bin
